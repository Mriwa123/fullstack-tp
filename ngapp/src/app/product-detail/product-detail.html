<div class="container py-4">
  <a routerLink="/products" class="btn btn-link">← Back to catalogue</a>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else if (product(); as p) {
    <div class="row mt-3">
      <div class="col-md-5">
        <img [src]="p.thumbnail" [alt]="p.title" class="img-fluid border rounded" />
      </div>
      <div class="col-md-7">
        <h1>{{ p.title }}</h1>
        <p class="text-success fs-4 fw-bold">{{ '$' + p.price }}</p>
        <p class="text-muted">{{ p.category.name }} · stock: {{ p.stock }}</p>
        <p>{{ p.description }}</p>
      </div>
    </div>
  } @else {
    <div class="text-center"><div class="spinner-border"></div></div>
  }
</div>
