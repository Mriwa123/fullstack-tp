<a [routerLink]="['/products', product().id]" class="text-decoration-none text-dark">
  <div class="card h-100 shadow-sm">
    <img
      [src]="product().thumbnail"
      [alt]="product().title"
      class="card-img-top p-3"
      style="height: 200px; object-fit: contain"
    />
    <div class="card-body">
      <h5 class="card-title">{{ product().title }}</h5>
      <p class="text-success fw-bold">{{ '$' + product().price }}</p>
      <p class="card-text text-muted" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{ product().description }}</p>
    </div>
  </div>
</a>
