<div class="container py-4">
  <div class="row g-2 mb-4">
    <div class="col-12 col-md-5">
      <input
        #qInput
        type="text"
        class="form-control"
        placeholder="Search products..."
        [value]="q()"
        (keyup.enter)="search(qInput.value, catSelect.value)"
      />
    </div>
    <div class="col-12 col-md-4">
      <select
        #catSelect
        class="form-select"
        (change)="search(qInput.value, catSelect.value)"
      >
        <option value="">All categories</option>
        @for (c of categories(); track c.id) {
          <option [value]="c.name" [selected]="c.name === category()">
            {{ c.name }} ({{ c._count.products }})
          </option>
        }
      </select>
    </div>
    <div class="col-6 col-md-2 d-grid">
      <button class="btn btn-primary" (click)="search(qInput.value, catSelect.value)">
        Search
      </button>
    </div>
    <div class="col-6 col-md-1 d-grid">
      <button
        class="btn btn-outline-secondary"
        (click)="qInput.value = ''; catSelect.value = ''; reset()"
      >
        Reset
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="text-center"><div class="spinner-border"></div></div>
  } @else if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else {
    <p class="text-muted">{{ total() }} product(s)</p>

    @if (products().length === 0) {
      <p>No products found.</p>
    } @else {
      <div class="row g-4">
        @for (p of products(); track p.id) {
          <div class="col-12 col-sm-6 col-lg-3">
            <app-product-card [product]="p" />
          </div>
        }
      </div>
    }

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button class="btn btn-outline-primary" [disabled]="!hasPrev()" (click)="prev()">Previous</button>
      <span>Page {{ page() }} / {{ totalPages() }}</span>
      <button class="btn btn-outline-primary" [disabled]="!hasNext()" (click)="next()">Next</button>
    </div>
  }
</div>
